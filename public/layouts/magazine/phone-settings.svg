<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
<style>
.g{font-family:Georgia,"Times New Roman",serif;fill:#1d1a15}
.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1d1a15}
.b{font-family:system-ui,sans-serif;font-size:9px;font-weight:600;letter-spacing:1.5px;fill:#1d1a15;text-anchor:middle}
.l{font-family:system-ui,sans-serif;font-size:8px;font-weight:600;letter-spacing:1.3px;fill:#1d1a15}
.v{font-family:system-ui,sans-serif;font-size:11px;fill:#1d1a15}
.e{font-family:Georgia,serif;font-size:9px;font-style:italic;fill:#6b6356}
.i{font-style:italic}
.m{fill:#6b6356}
.a{fill:#8b1e1e}
.r{stroke:#d8cfbc}
.R{stroke:#1d1a15}
.f{fill:none;stroke:#1d1a15}
.w{fill:#fbf8f1;stroke:#1d1a15}
</style>
<rect width="390" height="844" fill="#f6f1e7"/>
<!-- status bar -->
<text class="s" x="28" y="31" font-size="15" font-weight="600">9:41</text>
<rect x="318" y="20" width="3" height="4" fill="#1d1a15"/><rect x="323" y="18" width="3" height="6" fill="#1d1a15"/><rect x="328" y="16" width="3" height="8" fill="#1d1a15"/><rect x="333" y="14" width="3" height="10" fill="#1d1a15"/>
<rect x="342" y="15" width="22" height="10" rx="2.5" class="f"/><rect x="344" y="17" width="16" height="6" rx="1" fill="#1d1a15"/><rect x="365" y="18" width="1.5" height="4" fill="#1d1a15"/>
<!-- masthead -->
<text class="s m" x="20" y="60" font-size="8" letter-spacing="1">WEDNESDAY 21 OCTOBER 2026</text>
<text class="s m" x="370" y="60" font-size="8" letter-spacing="1" text-anchor="end">CRAFTY, ADMIN</text>
<line x1="20" y1="68" x2="370" y2="68" class="r"/>
<text class="g" x="195" y="118" font-size="54" letter-spacing="1" text-anchor="middle">Arrmy</text>
<text class="g m i" x="195" y="134" font-size="10" text-anchor="middle">Movies, TV Shows and Audiobooks for the family Plex</text>
<line x1="20" y1="146" x2="370" y2="146" class="R"/>
<text class="b" x="45" y="163">HOME</text><text class="b" x="120" y="163">REQUESTS</text><text class="b" x="195" y="163">ADMIN</text><text class="b a" x="270" y="163">SETTINGS</text><text class="b" x="345" y="163">PHONE</text>
<rect x="239" y="168" width="62" height="2" fill="#8b1e1e"/>
<line x1="20" y1="176" x2="370" y2="176" class="R"/><line x1="20" y1="179" x2="370" y2="179" class="R"/>
<!-- title and save -->
<text class="g" x="20" y="222" font-size="26">Masthead &amp; policies</text>
<rect x="296" y="202" width="74" height="26" rx="2" class="f"/><text class="b" x="333" y="219">SAVE</text>
<text class="g m i" x="20" y="240" font-size="11">How big a Request may be, and where Arrmy posts.</text>
<!-- size limits -->
<line x1="20" y1="256" x2="370" y2="256" class="R"/>
<text class="g" x="20" y="280" font-size="19">Size limits</text>
<text class="g m i" x="20" y="296" font-size="10">Anything bigger is refused at the point of Request.</text>
<text class="l" x="20" y="318">MOVIE, GB</text><rect x="20" y="324" width="165" height="26" class="w"/><text class="v" x="28" y="341">40</text>
<text class="e" x="20" y="362">Per film. 4K needs 60 or more.</text>
<text class="l" x="205" y="318">EPISODE, GB PER HOUR</text><rect x="205" y="324" width="165" height="26" class="w"/><text class="v" x="213" y="341">4</text>
<text class="e" x="205" y="362">A 45-minute episode may be 3 GB.</text>
<text class="l" x="20" y="376">AUDIOBOOK, MB</text><rect x="20" y="382" width="165" height="26" class="w"/><text class="v" x="28" y="399">600</text>
<text class="e" x="20" y="420">Most 16-hour books are under 500 MB.</text>
<!-- quality -->
<line x1="20" y1="436" x2="370" y2="436" class="R"/>
<text class="g" x="20" y="460" font-size="19">Quality</text>
<text class="g m i" x="20" y="476" font-size="10">What Radarr and Sonarr search for.</text>
<text class="l" x="20" y="498">MOVIES</text><rect x="20" y="504" width="165" height="26" class="w"/><text class="v" x="28" y="521">HD-1080p</text><path d="M168 514l4 4 4-4" class="f"/>
<text class="e" x="20" y="542">Every new Movie Request.</text>
<text class="l" x="205" y="498">TV SHOWS</text><rect x="205" y="504" width="165" height="26" class="w"/><text class="v" x="213" y="521">HD-1080p</text><path d="M353 514l4 4 4-4" class="f"/>
<text class="e" x="205" y="542">Season packs preferred.</text>
<text class="l" x="20" y="556">ANIME</text><rect x="20" y="562" width="165" height="26" class="w"/><text class="v" x="28" y="579">Any</text><path d="M168 572l4 4 4-4" class="f"/>
<text class="e" x="20" y="600">Fansubs vary; Any arrives sooner.</text>
<!-- discord -->
<line x1="20" y1="616" x2="370" y2="616" class="R"/>
<text class="g" x="20" y="640" font-size="19">Discord</text>
<text class="g m i" x="20" y="656" font-size="10">Where Arrmy posts when a Request becomes Available.</text>
<rect x="20" y="668" width="14" height="14" rx="2" fill="#8b1e1e"/><path d="M23 675l3 3 6-6" fill="none" stroke="#fff" stroke-width="1.8"/>
<text class="v" x="42" y="679">Post to Discord</text>
<text class="l" x="20" y="700">SERVER</text><rect x="20" y="706" width="165" height="26" class="w"/><text class="v" x="28" y="723">The Crafty Lounge</text>
<text class="e" x="20" y="744">The bot must be invited there.</text>
<text class="l" x="205" y="700">CHANNEL</text><rect x="205" y="706" width="165" height="26" class="w"/><text class="v" x="213" y="723">#arrmy</text>
<text class="e" x="205" y="744">Announcements go here.</text>
<!-- public address -->
<line x1="20" y1="758" x2="370" y2="758" class="R"/>
<text class="g" x="20" y="780" font-size="19">Public address</text>
<text class="l" x="20" y="798">ADDRESS</text><rect x="20" y="804" width="350" height="26" class="w"/><text class="v" x="28" y="821">https://arrmy.craftyplayz.com</text>
</svg>
