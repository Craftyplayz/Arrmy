<text class="k a" x="370" y="472" text-anchor="end">REQUEST</text>
<text class="g" font-size="11"><tspan x="72" y="489">A mixed-race master of the sword seeks</tspan><tspan x="72" y="503">revenge in Edo-period Japan.</tspan></text>
