<text class="k a" x="370" y="554" text-anchor="end">REQUEST</text>
<text class="g" font-size="11"><tspan x="72" y="571">The story of J. Robert Oppenheimer and</tspan><tspan x="72" y="585">the making of the atomic bomb.</tspan></text>
