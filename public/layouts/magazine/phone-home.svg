<text class="g" x="156" y="248" font-size="34">Fallout</text>
<text class="g" font-size="12.5"><tspan x="156" y="270">Two hundred years after the</tspan><tspan x="156" y="287">apocalypse, a vault dweller</tspan><tspan x="156" y="304">ventures out into the wasteland.</tspan></text>
<text class="s m" x="156" y="324" font-size="9.5">TV Show · 2024 · 1 season · Sci-Fi, Action</text>
<line x1="156" y1="334" x2="370" y2="334" class="R"/>
<text class="g i a" font-size="11.5"><tspan x="156" y="350">“Request it and it is in Plex</tspan><tspan x="156" y="365">within a day.”</tspan></text>
