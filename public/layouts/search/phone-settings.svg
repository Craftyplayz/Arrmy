<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="390" height="844" fill="#faf7f2"/>
<text x="28" y="38" font-size="15" font-weight="600" fill="#1f1d1a">9:41</text>
<g fill="#1f1d1a"><rect x="296" y="30" width="3" height="8" rx="1"/><rect x="301" y="28" width="3" height="10" rx="1"/><rect x="306" y="26" width="3" height="12" rx="1"/><rect x="311" y="24" width="3" height="14" rx="1"/><rect x="336" y="28" width="20" height="8" rx="2"/><rect x="359.5" y="30" width="2" height="4" rx="1"/></g>
