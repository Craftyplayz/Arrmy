<rect y="56" width="390" height="48" fill="#fff"/><line x1="0" y1="104.5" x2="390" y2="104.5" stroke="#e6e0d6"/>
<text x="20" y="87" font-size="19" font-weight="700" fill="#1f1d1a">Arrmy</text>
<text x="370" y="86" font-size="13" fill="#6b6560" text-anchor="end">Crafty</text>

<text x="20" y="148" font-size="28" font-weight="700" fill="#1f1d1a" letter-spacing="-.5">Settings</text>
<text x="20" y="172" font-size="13" fill="#6b6560">How big a Request may be, and what quality to fetch.</text>

<g font-size="11" fill="#6b6560">
<text x="20" y="216" font-size="18" font-weight="650" fill="#1f1d1a">Size limits</text>
<text x="20" y="236" font-size="12">A Request over its limit is refused.</text>

<text x="20" y="266" font-size="13" font-weight="600" fill="#1f1d1a">Movie, GB</text>
<rect x="20" y="276" width="120" height="40" rx="8" fill="#fff" stroke="#cfc7ba"/><text x="34" y="301" font-size="15" fill="#1f1d1a">40</text>
<text x="20" y="334">Most 1080p films are 10 to 30 GB. 4K ones can pass 60 GB.</text>

<text x="20" y="364" font-size="13" font-weight="600" fill="#1f1d1a">TV episode, GB per hour</text>
<rect x="20" y="374" width="120" height="40" rx="8" fill="#fff" stroke="#cfc7ba"/><text x="34" y="399" font-size="15" fill="#1f1d1a">4</text>
<text x="20" y="432">A 45-minute episode may use three quarters of this.</text>

<text x="20" y="462" font-size="13" font-weight="600" fill="#1f1d1a">Audiobook, MB</text>
<rect x="20" y="472" width="120" height="40" rx="8" fill="#fff" stroke="#cfc7ba"/><text x="34" y="497" font-size="15" fill="#1f1d1a">600</text>
<text x="20" y="530">Anything bigger is usually a lossless rip.</text>

<line x1="20" y1="554.5" x2="370" y2="554.5" stroke="#e6e0d6"/>
<text x="20" y="590" font-size="18" font-weight="650" fill="#1f1d1a">Quality</text>
<text x="20" y="610" font-size="12">The profile Radarr and Sonarr look for.</text>

<text x="20" y="640" font-size="13" font-weight="600" fill="#1f1d1a">Movies</text>
<rect x="20" y="650" width="350" height="40" rx="8" fill="#fff" stroke="#cfc7ba"/><text x="34" y="675" font-size="15" fill="#1f1d1a">HD-1080p</text>
<path d="M346 667l6 6 6-6" fill="none" stroke="#6b6560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="20" y="708">HD-1080p suits most TVs and keeps the disk from filling.</text>
</g>

<rect y="718" width="390" height="52" fill="#faf7f2"/><line x1="0" y1="718.5" x2="390" y2="718.5" stroke="#e6e0d6"/>
<text x="20" y="748" font-size="11" fill="#6b6560">Nothing changes until you press Save.</text>
<rect x="290" y="728" width="80" height="32" rx="16" fill="#1d5c8f"/><text x="330" y="748" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Save</text>

<rect y="770" width="390" height="74" fill="#fff"/><line x1="0" y1="770.5" x2="390" y2="770.5" stroke="#e6e0d6"/>
