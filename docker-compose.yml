# The Arrmy Stack, Milestone 1 (Movies + TV). Deploy as a Portainer stack from this repo, or with `docker compose up -d`.
# Settings come from the environment variables in .env.example. Only Arrmy is public (through Cloudflare Tunnel);
# the other ports are for you on the home network.

x-linuxserver: &linuxserver
  restart: unless-stopped
  environment: &env
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}

x-after-init: &after-init
  init:
    condition: service_completed_successfully

services:
  # Runs once per deploy: creates the /data folders, qBittorrent's login and LazyLibrarian's settings, then exits.
  init:
    image: ghcr.io/craftyplayz/arrmy:1.1.0-rc.52
    user: root
    command: [node, init.mjs]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      QBIT_PASSWORD: ${QBIT_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET} # LazyLibrarian's API key is derived from it
    volumes:
      - ${DATA_DIR:-/data}:/data
      - ${CONFIG_DIR:-/opt/arrmy}:/config

  arrmy:
    image: ghcr.io/craftyplayz/arrmy:1.1.0-rc.52
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      QBIT_PASSWORD: ${QBIT_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      DISCORD_ADMIN_ID: ${DISCORD_ADMIN_ID:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      PORTAINER_STACK_URL: ${PORTAINER_STACK_URL:-}
      ABS_API_KEY: ${ABS_API_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      HARDCOVER_TOKEN: ${HARDCOVER_TOKEN:-}
      ABB_PROXY: http://gluetun:8888 # AudioBook Bay times out on the home connection: through the VPN instead
      DOCTOR: ${CLAUDE_CODE_OAUTH_TOKEN:+on} # hands Problems to the doctor only when it's set up
    volumes:
      - ${CONFIG_DIR:-/opt/arrmy}/arrmy:/config
      - ${BACKUP_DIR:-/opt/arrmy-backups}:/backups:ro # so the Discord bot can report the nightly backup
      - ${DATA_DIR:-/data}:/data # Audiobook Editions: hard-linked from torrents/ into media/audiobooks/
      - ${CONFIG_DIR:-/opt/arrmy}/kometa:/kometa # Arrmy writes Kometa's config.yml and "Requested by" collections
    ports:
      - ${ARRMY_PORT:-7654}:3000 # only the port on the box changes; inside Docker it's always 3000
    depends_on: *after-init

  plex:
    <<: *linuxserver
    image: lscr.io/linuxserver/plex:latest
    environment:
      <<: *env
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM}
    volumes:
      - ${CONFIG_DIR:-/opt/arrmy}/plex:/config
      - ${DATA_DIR:-/data}/media:/data/media
    ports:
      - ${PLEX_PORT:-32400}:32400

  gluetun:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    healthcheck:
      start_period: 2m # PIA can take longer than the image's default to connect; keeps its own health test
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${VPN_TYPE}
      OPENVPN_USER: ${OPENVPN_USER}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD}
      SERVER_REGIONS: ${SERVER_REGIONS}
      PORT_FORWARD_ONLY: ${PORT_FORWARD_ONLY}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING}
      HTTPPROXY: "on" # gluetun:8888 inside Docker; Prowlarr's proxy setting sends indexer traffic through the VPN
      # From the gluetun wiki: hands qBittorrent the forwarded port and binds it to the VPN interface.
      # Works because init sets qBittorrent's "bypass authentication for localhost".
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
    volumes:
      # Keeps the forwarded port across restarts, and holds auth/config.toml: init writes the doctor's key to
      # gluetun's control server (gluetun:8000, inside Docker only) there, so the doctor can change VPN region.
      - ${CONFIG_DIR:-/opt/arrmy}/gluetun:/gluetun
    ports:
      - ${QBIT_PORT:-7655}:8080 # qBittorrent web UI: qBittorrent lives inside gluetun's network
    depends_on: *after-init # gluetun reads the control server's keys only when it starts

  qbittorrent:
    <<: *linuxserver
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:gluetun # all torrent traffic goes through the VPN or nowhere
    environment:
      <<: *env
      WEBUI_PORT: 8080
    volumes:
      - ${CONFIG_DIR:-/opt/arrmy}/qbittorrent:/config
      - ${DATA_DIR:-/data}:/data
    depends_on:
      <<: *after-init # init must write the login before qBittorrent creates its own config
      gluetun:
        condition: service_healthy

  prowlarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      <<: *env
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY}
    volumes:
      - ${CONFIG_DIR:-/opt/arrmy}/prowlarr:/config
    ports:
      - ${PROWLARR_PORT:-7656}:9696

  # Solves Cloudflare challenges for indexers tagged "flaresolverr" in Prowlarr. Lives in gluetun's
  # network like qBittorrent, so sites blocked on the home connection work; Prowlarr reaches it at gluetun:8191.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    network_mode: service:gluetun
    environment:
      TZ: ${TZ}
    depends_on:
      gluetun:
        condition: service_healthy

  radarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/radarr:latest
    environment:
      <<: *env
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY}
    volumes:
      - ${CONFIG_DIR:-/opt/arrmy}/radarr:/config
      - ${DATA_DIR:-/data}:/data
    ports:
      - ${RADARR_PORT:-7657}:7878

  sonarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      <<: *env
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY}
    volumes:
      - ${CONFIG_DIR:-/opt/arrmy}/sonarr:/config
      - ${DATA_DIR:-/data}:/data
    ports:
      - ${SONARR_PORT:-7658}:8989

  # Finds and downloads audiobooks and ebooks for Requests, as Radarr does for movies. Finished audiobooks land
  # in /data/media/audiobooks, which Audiobookshelf watches. init presets its settings; Arrmy derives its API key.
  lazylibrarian:
    <<: *linuxserver
    image: lscr.io/linuxserver/lazylibrarian:latest
    volumes:
      - ${CONFIG_DIR:-/opt/arrmy}/lazylibrarian:/config
      - ${DATA_DIR:-/data}:/data
    ports:
      - ${LL_PORT:-7659}:5299
    depends_on: *after-init

  # Plex watch history: who watched what, for the Request page, the Admin view and #watched. init presets its API key
  # and Plex's address; sign in with Plex once in its own page to finish setting it up.
  tautulli:
    <<: *linuxserver
    image: lscr.io/linuxserver/tautulli:latest
    volumes:
      - ${CONFIG_DIR:-/opt/arrmy}/tautulli:/config
    ports:
      - ${TAUTULLI_PORT:-7660}:8181
    depends_on: *after-init

  # Grabs releases the moment a private tracker announces them on IRC, instead of waiting for Radarr's and Sonarr's
  # next RSS check. Arrmy makes its account (admin / QBIT_PASSWORD) and adds Radarr, Sonarr and qBittorrent as clients;
  # the IRC networks, indexers and filters are yours to add in its own page.
  autobrr:
    image: ghcr.io/autobrr/autobrr:latest
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      AUTOBRR__HOST: 0.0.0.0 # its default is localhost, which Docker's port can't reach
    volumes:
      - ${CONFIG_DIR:-/opt/arrmy}/autobrr:/config
    ports:
      - ${AUTOBRR_PORT:-7661}:7474
    depends_on: *after-init

  # Re-encodes the library to H.265 to save disk space. The server has no GPU, so it encodes on the CPU, and only
  # between 01:00 and 07:00 (a library Schedule, set in its page: README) so Plex isn't slowed. Sees only
  # media/, never torrents/, so seeding files and their hardlinks are untouched. It replaces files in place.
  tdarr:
    <<: *linuxserver
    image: ghcr.io/haveagitgat/tdarr:latest
    environment:
      <<: *env
      UMASK: "002"
      serverIP: 0.0.0.0
      serverPort: 8266
      webUIPort: 8265
      internalNode: "true"
      inContainer: "true"
      nodeName: ArrmyNode
    volumes:
      - ${CONFIG_DIR:-/opt/arrmy}/tdarr/server:/app/server
      - ${CONFIG_DIR:-/opt/arrmy}/tdarr/configs:/app/configs
      - ${CONFIG_DIR:-/opt/arrmy}/tdarr/logs:/app/logs
      - ${CONFIG_DIR:-/opt/arrmy}/tdarr/temp:/temp # the file being encoded, before it replaces the original
      - ${DATA_DIR:-/data}/media:/data/media
    ports:
      - ${TDARR_PORT:-7662}:8265
    depends_on: *after-init

  # Plex collections (franchises, "Requested by <name>") and poster overlays (resolution, HDR, audio, New, Leaving
  # soon), nightly at 06:00 in TZ: after the 04:00 UTC backup even in summer time. Arrmy writes its config into this
  # folder (it has the Plex token and the Requests). It has no Radarr or Sonarr, so it never downloads anything.
  kometa:
    image: kometateam/kometa:latest
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      KOMETA_TIMES: "06:00"
    volumes:
      - ${CONFIG_DIR:-/opt/arrmy}/kometa:/config
    depends_on: *after-init

  # The doctor: Claude looks into each Problem and posts what it found to #problems, on your Claude subscription. It reads
  # the apps' APIs and can only run a few safe fixes (search again, another release, restart an app): scripts/doctor.mjs.
  # Without CLAUDE_CODE_OAUTH_TOKEN it exits at once and stays stopped.
  doctor:
    image: ghcr.io/craftyplayz/arrmy:1.1.0-rc.52
    restart: on-failure
    user: "${PUID}:${PGID}"
    command: [node, doctor.mjs]
    environment:
      TZ: ${TZ}
      HOME: /config # Claude Code keeps its CLI and settings here
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      DISABLE_AUTOUPDATER: 1 # doctor.mjs updates it on each start
      DOCTOR_DAILY: ${DOCTOR_DAILY:-10}
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      QBIT_PASSWORD: ${QBIT_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - ${CONFIG_DIR:-/opt/arrmy}/doctor:/config
    depends_on: *after-init

  # Audiobooks, podcasts and ebooks. The paths inside the container never change, so ABS keeps
  # listening progress and stats when the files move on the server. Follows latest: it's public, so it
  # needs security fixes. ABS upgrades its database on start (one-way); the nightly backup holds the old one.
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR:-/opt/arrmy}/audiobookshelf/config:/config
      - ${CONFIG_DIR:-/opt/arrmy}/audiobookshelf/metadata:/metadata
      - ${DATA_DIR:-/data}/media/audiobooks:/audiobooks
      - ${DATA_DIR:-/data}/media/podcasts:/podcasts
      - ${DATA_DIR:-/data}/media/books:/books
    ports:
      - ${ABS_PORT:-13378}:80
    depends_on: *after-init

  # Copies every app's settings at start and nightly at 04:00 (UTC), keeping BACKUP_KEEP_DAYS days.
  # Plex's cache, artwork and logs are skipped: large, and Plex re-downloads them. Restore steps: README.
  # ./data is skipped too, for when DATA_DIR is CONFIG_DIR/data: that's the media, not settings.
  backup:
    image: alpine:latest
    restart: unless-stopped
    volumes:
      - ${CONFIG_DIR:-/opt/arrmy}:/config:ro
      - ${BACKUP_DIR:-/opt/arrmy-backups}:/backups
    entrypoint: [/bin/sh, -c]
    command:
      - |
        cat > /backup.sh <<'SCRIPT'
        name=/backups/arrmy-$$(date +%F-%H%M).tar.gz
        if tar -czf "$$name.part" -C /config --exclude='./data' \
            --exclude='*/Plex Media Server/Cache' --exclude='*/Plex Media Server/Media' \
            --exclude='*/Plex Media Server/Metadata' --exclude='*/Plex Media Server/Logs' \
            --exclude='audiobookshelf/metadata/cache' --exclude='audiobookshelf/metadata/logs' \
            --exclude='audiobookshelf/metadata/backups' --exclude='audiobookshelf/metadata/streams' \
            --exclude='tautulli/cache' --exclude='tautulli/logs' --exclude='tautulli/backups' \
            --exclude='tdarr/temp' --exclude='tdarr/logs' --exclude='tdarr/server/Tdarr/Backups' \
            --exclude='kometa/logs' --exclude='kometa/config.cache' .; then
          mv "$$name.part" "$$name" && echo "[backup] saved $$name ($$(du -h "$$name" | cut -f1))"
        else
          rm -f "$$name.part" && echo "[backup] FAILED, kept the older backups"
        fi
        find /backups -name 'arrmy-*.tar.gz' -mtime +${BACKUP_KEEP_DAYS:-7} -delete
        SCRIPT
        echo '0 4 * * * sh /backup.sh' > /etc/crontabs/root
        sh /backup.sh
        exec crond -f

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [arrmy]
